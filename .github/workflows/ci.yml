name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# 发 Release 要写权限；默认的 GITHUB_TOKEN 只有读
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 APK + 16 KB 自检
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：ubuntu-latest 镜像本来就预装了 Android SDK
      # （ANDROID_SDK_ROOT + cmdline-tools），那个动作反而是多一层可能挂掉的依赖。
      # compileSdk 37 不是预装的，所以还是要自己补 platform。
      # 包名是 platforms;android-37.0（带小版本号），写 android-37 会找不到。
      - name: 安装 platform 37
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK_ROOT=$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.0"
          echo "--- 已安装的平台 ---"
          ls "$SDK/platforms"

      - uses: gradle/actions/setup-gradle@v4

      # Windows 上提交的文件没有可执行位，Linux runner 直接 ./gradlew 会 permission denied
      - name: 赋可执行权限
        run: chmod +x gradlew

      - name: 构建 debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      # assembleDebug 的 finalizedBy 已经跑过一次，这里显式再跑：
      # 一是让日志里有一个独立、明确的步骤名，二是防止将来有人摘掉 finalizedBy
      - name: 16 KB 页对齐检查
        run: ./gradlew :composeApp:verify16kbPageSize --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: pui-demo-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 版本号写在 build.gradle.kts 里，这里读出来拼成 tag —— 不额外维护一份
      # APK 直接挂到 Release 上：Actions 产物要登录才能下、14 天就过期，
      # Release 附件才是对外能给的地址。同名 Release 已存在就只替换附件，
      # 所以同一个版本重复推 main 不会堆出一串 Release。
      - name: 发布 Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^"]+' composeApp/build.gradle.kts)
          TAG="v$VERSION"
          APK="PUIDemo-$VERSION.apk"
          cp composeApp/build/outputs/apk/debug/composeApp-debug.apk "$APK"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "已有 $TAG，替换附件"
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "PUI Demo $VERSION" \
              --generate-notes
          fi
          gh release view "$TAG" --json url,assets \
            --jq '"Release: " + .url + "  附件: " + ([.assets[].name] | join(", "))'
