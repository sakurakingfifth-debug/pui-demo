name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 APK + 16 KB 自检
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 37 不是 runner 预装的，必须自己拉。
      # 包名是 platforms;android-37.0（带小版本号），不是 android-37。
      - name: 安装 platform 37
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # Windows 上提交的文件没有可执行位，Linux runner 直接 ./gradlew 会 permission denied
      - name: 赋可执行权限
        run: chmod +x gradlew

      - name: 构建 debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      # assembleDebug 的 finalizedBy 已经跑过一次，这里显式再跑：
      # 一是让日志里有一个独立、明确的步骤名，二是防止将来有人摘掉 finalizedBy
      - name: 16 KB 页对齐检查
        run: ./gradlew :composeApp:verify16kbPageSize --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: pui-demo-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
